[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/AstonRendar/jade"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
mockall = "0.13"
jade-shared = { path = "crates/shared" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
