[package]
name = "jade-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jade-shared.workspace = true
chrono.workspace = true
gethostname.workspace = true
git2.workspace = true
keyring-core.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
libgit2-sys = "0.18"
openssl-sys = "0.9"

[dev-dependencies]
cucumber.workspace = true
mockall.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "functional"
path = "tests/functional/main.rs"
harness = false

[lints]
workspace = true
